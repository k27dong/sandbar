name: mac

on:
  pull_request:
    types: [labeled]
  push:
    branches: [master]
    paths:
      - Sources/SandbarUI/**
      - Sources/Sandbar/**
      - Tests/SandbarUITests/**
      - Tests/Stages/**
      - Scripts/**
      - Package.swift
      - .github/workflows/mac.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}-${{ github.event.label.name }}  # with the label, so that another label's event cancels no Mac run
  cancel-in-progress: true

jobs:
  mac:
    if: github.event_name != 'pull_request' || github.event.label.name == 'mac'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test -j 3
        env:
          SANDBAR_PICTURES: ${{ runner.temp }}/pictures
      - run: Scripts/build-app.sh debug
      - run: Scripts/screenshot-app.sh "$RUNNER_TEMP/pictures/app-empty.png"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pictures
          path: ${{ runner.temp }}/pictures
          retention-days: 7
