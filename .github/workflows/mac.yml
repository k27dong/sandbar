name: mac

on:
  pull_request:
    types: [labeled]
  push:
    branches: [master]
    paths:
      - Sources/SandbarUI/**
      - Sources/Sandbar/**
      - Tests/SandbarUITests/**
      - Tests/Stages/**
      - Scripts/**
      - Package.swift
      - .github/workflows/mac.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-${{ github.ref }}-${{ github.event.label.name }}  # with the label, so that another label's event cancels no Mac run
  cancel-in-progress: true

jobs:
  mac:
    if: github.event_name != 'pull_request' || github.event.label.name == 'mac'
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test -j 3
        env:
          SANDBAR_PICTURES: ${{ runner.temp }}/pictures
          SANDBAR_FETCH: ${{ contains(github.event.pull_request.labels.*.name, 'fetch') && '1' || '0' }}
      - run: |
          for scrollBars in Always WhenScrolling; do  # a program reads this setting once, when it starts
            defaults write -g AppleShowScrollBars -string "$scrollBars"
            swift test --filter aListTallerThanTheLimit
          done
        env:
          SANDBAR_PICTURES: ${{ runner.temp }}/pictures
      - run: Scripts/build-app.sh debug
      - run: Scripts/screenshot-app.sh limit "$RUNNER_TEMP/pictures/app-limit.png"
      - run: Scripts/screenshot-app.sh - "$RUNNER_TEMP/pictures/app-first.png"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pictures
          path: ${{ runner.temp }}/pictures
          retention-days: 7
